[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-task-router"
version = "0.1.0"
description = "Deterministic local router for new Codex/Claude tasks. Stdlib only, no runtime dependencies."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []

[project.scripts]
codex-route = "router.cli:main"

[tool.setuptools]
packages = ["router"]
